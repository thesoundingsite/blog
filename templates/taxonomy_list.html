{% extends "base.html" %}
{% block title %}Tags · {{ config.title }}{% endblock title %}
{% block content %}
<h1>Tags</h1>
<ul class="post-list">
  {% for term in terms %}
  <li><a href="{{ term.permalink | safe }}">#{{ term.name }}</a> ({{ term.pages | length }})</li>
  {% else %}
  <li>No tags yet.</li>
  {% endfor %}
</ul>
{% endblock content %}
