<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  {% if config.description %}<meta name="description" content="{{ config.description }}">{% endif %}
  <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/brand/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="/brand/favicon-16.png" type="image/png" sizes="16x16" />
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
  <link rel="stylesheet" href="{{ get_url(path='theme.css', cachebust=true) }}">
  <link rel="stylesheet" href="{{ get_url(path='style.css', cachebust=true) }}">
  <script src="{{ get_url(path='theme.js', cachebust=true) }}"></script>
  <link id="hl-light" rel="stylesheet" href="{{ get_url(path='giallo-light.css') }}" media="(prefers-color-scheme: light)">
  <link id="hl-dark" rel="stylesheet" href="{{ get_url(path='giallo-dark.css') }}" media="(prefers-color-scheme: dark)">
  <script>
    // Follow the appearance choice for the highlight sheets: theme.js stamps
    // <html data-theme>; with no attribute (Auto) the system query decides.
    (function () {
      var root = document.documentElement;
      function sync() {
        var t = root.getAttribute("data-theme");
        document.getElementById("hl-light").media =
          t === "light" ? "all" : t === "dark" ? "not all" : "(prefers-color-scheme: light)";
        document.getElementById("hl-dark").media =
          t === "dark" ? "all" : t === "light" ? "not all" : "(prefers-color-scheme: dark)";
      }
      sync();
      new MutationObserver(sync).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
    })();
  </script>
  <link rel="alternate" type="application/atom+xml" title="{{ config.title }}" href="{{ get_url(path='atom.xml', trailing_slash=false) }}">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ config.base_url }}">{{ config.title }}</a>
    <div class="site-controls">
      <nav>
        <a href="https://thesounding.site">Sounding</a>
        <a href="{{ get_url(path='@/posts/_index.md') }}">Posts</a>
        <a href="{{ get_url(path='tags') }}">Tags</a>
        <a href="{{ get_url(path='atom.xml', trailing_slash=false) }}">Feed</a>
      </nav>
      <div role="group" aria-label="Appearance" class="theme-switch" data-theme-switch>
        <button type="button" value="auto" aria-label="Auto" title="Auto" aria-pressed="true">
          <svg aria-hidden="true" viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="9" r="6.5"></circle>
            <path d="M9 2.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"></path>
          </svg>
        </button>
        <button type="button" value="light" aria-label="Light" title="Light" aria-pressed="false">
          <svg aria-hidden="true" viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="9" r="3.2"></circle>
            <path d="M9 1.5v2M9 14.5v2M1.5 9h2M14.5 9h2M3.7 3.7l1.4 1.4M12.9 12.9l1.4 1.4M3.7 14.3l1.4-1.4M12.9 5.1l1.4-1.4"></path>
          </svg>
        </button>
        <button type="button" value="dark" aria-label="Dark" title="Dark" aria-pressed="false">
          <svg aria-hidden="true" viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.8 11.2A6.5 6.5 0 0 1 6.8 3.2a6.5 6.5 0 1 0 8 8z"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>
  <main>
    {% block content %}{% endblock content %}
  </main>
  <footer class="site-footer">
    <div class="sounding-footer">
      <a href="https://thesounding.site/" aria-label="thesounding.site" class="lockup">
        <svg viewBox="10.50 2.30 43.10 59.20" aria-hidden="true" class="logo">
          <g transform="rotate(22 32 33)">
            <path class="logo-ink" stroke-width="3.5" stroke-linecap="round" d="M42.25 8.25A14.5 14.5 0 1 0 32 33"></path>
          </g>
          <g transform="rotate(25 32 33)">
            <path class="logo-ink" stroke-width="3.5" stroke-linecap="round" d="M32 33A13.5 13.5 0 1 1 21.81 55.36"></path>
            <path class="logo-accent" stroke-width="1.75" stroke-linecap="round" d="M42.02 47.15A12.42 12.42 0 0 1 24.67 53.47M39.48 42.5A8.98 8.98 0 0 1 23.62 48.27M35.63 40.43A5.54 5.54 0 1 1 25.24 44.21"></path>
            <circle class="logo-accent-fill" cx="30.5" cy="42.5" r="1.75"></circle>
          </g>
          <path class="logo-accent" stroke-width="1.75" stroke-linecap="round" d="M28.26 15.97A43.04 43.04 0 0 1 48.26 21.77M27.44 19.75A39.24 39.24 0 0 1 46.94 25.41M27.98 23.56A35.44 35.44 0 0 1 44.44 28.34"></path>
          <circle class="logo-accent-fill" cx="39.68" cy="13.99" r="1.75"></circle>
        </svg>
        <span class="lockup-word" aria-hidden="true">
          <span class="lockup-the">the</span>
          <span class="lockup-name">sounding</span>
          <span class="lockup-dot"></span>
          <span class="lockup-site">site</span>
        </span>
      </a>
      <nav aria-label="Sounding sites">
        <a href="https://thesounding.site/">Sounding</a>
        <a href="https://free.thesounding.site/">Free version</a>
        <a href="https://pricing.thesounding.site/">Pricing demo</a>
        <a href="https://blog.thesounding.site/">Blog</a>
        <a href="https://github.com/thesoundingsite/sounding">Source</a>
      </nav>
      <a href="https://0rwx.com/" title="AI:W, AI has read-write permissions (0rwx.com)" class="ai-badge">
        <img src="/0rwx/AI-W-light.svg" alt="AI:W" width="32" height="32" class="ai-badge-light">
        <img src="/0rwx/AI-W-dark.svg" alt="" width="32" height="32" class="ai-badge-dark">
      </a>
    </div>
  </footer>
</body>
</html>
